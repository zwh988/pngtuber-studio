[project]
name = "pngtuber-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
