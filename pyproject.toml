[project]
name = "pngtuber-studio"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "chatterbox-tts>=0.1.7",
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "pywebview>=6.2.1",
    "setuptools<81",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
